# Configuración para desarrollo local
spring.datasource.url=jdbc:postgresql://localhost:5432/casaflow
spring.datasource.username=casaflow
spring.datasource.password=casaflow

# Puerto del servidor
server.port=8080

# JPA/Hibernate - No modificar esquema (Flyway ya lo creó)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
