spring:
  config:
    # En desarrollo lee las variables de .env (si existe); en producción vienen del entorno.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/homeforge}
    username: ${DB_USERNAME:homeforge}
    password: ${DB_PASSWORD:homeforge_local}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 96MB
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Detrás de un proxy (producción) usa "framework" para leer la IP real de X-Forwarded-For.
  # En local se deja en "none": sin proxy, cualquiera podría falsear su IP con ese encabezado.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5174}
  jwt:
    secret: ${JWT_SECRET:}
    # En producción es obligatoria: sin ella cada reinicio generaría otra clave y cerraría todas las sesiones.
    require-secret: ${JWT_REQUIRE_SECRET:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://172.27.9.148:5174}
  uploads:
    directory: ${UPLOADS_DIRECTORY:uploads}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  plan:
    starter:
      price: ${PLAN_STARTER_PRICE:299}
    pro:
      price: ${PLAN_PRO_PRICE:999}
    business:
      price: ${PLAN_BUSINESS_PRICE:3999}

mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
  public-key: ${MERCADOPAGO_PUBLIC_KEY:}
  plan:
    starter:
      price: ${PLAN_STARTER_PRICE:299}
    pro:
      price: ${PLAN_PRO_PRICE:999}
    business:
      price: ${PLAN_BUSINESS_PRICE:3999}
