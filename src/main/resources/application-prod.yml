# Perfil de producción (SPRING_PROFILES_ACTIVE=prod, lo activa el Dockerfile).
spring:
  jpa:
    properties:
      hibernate:
        format_sql: false

server:
  # La plataforma de despliegue pone un proxy delante: la IP real del cliente viene en X-Forwarded-For.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}

app:
  jwt:
    require-secret: true

# La documentación de la API no se publica en producción (no hace falta exponer el mapa de la API).
# Para revisarla en un entorno de pruebas: API_DOCS_ENABLED=true.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
